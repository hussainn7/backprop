<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Control</title>
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; color: #e0e0e0; font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: #16213e; border-bottom: 1px solid #0f3460; }
  header h1 { font-size: 18px; letter-spacing: 2px; color: #e94560; }
  .header-controls { display: flex; align-items: center; gap: 12px; font-size: 13px; }
  .btn { padding: 4px 12px; border: 1px solid #555; border-radius: 4px; background: #16213e; color: #ccc; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #0f3460; }
  .btn.active { background: #e94560; border-color: #e94560; color: #fff; }

  /* Bot cards row */
  .cards { display: flex; gap: 6px; padding: 8px 16px; background: #16213e; border-bottom: 1px solid #0f3460; overflow-x: auto; }
  .card { flex: 0 0 170px; padding: 8px 10px; border: 2px solid #333; border-radius: 6px; background: #1a1a2e; cursor: pointer; transition: border-color 0.2s; }
  .card:hover { border-color: #555; }
  .card.selected { border-width: 2px; }
  .card-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .card-role { font-size: 10px; color: #999; margin-bottom: 4px; }
  .bar-wrap { height: 6px; background: #333; border-radius: 3px; margin-bottom: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s; }
  .card-action { font-size: 11px; color: #aaa; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-thought { font-size: 10px; color: #777; font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin: 2px 0; min-height: 14px; }
  .card-pos { font-size: 10px; color: #666; margin-bottom: 4px; }
  .card-view { font-size: 11px; color: #4fc3f7; text-align: center; padding: 2px 0; border: 1px solid #4fc3f7; border-radius: 3px; }
  .card-view:hover { background: rgba(79,195,247,0.15); }

  /* Main area */
  .main { display: flex; flex: 1; min-height: 0; }
  .viewer { flex: 1; min-width: 0; }
  .viewer iframe { width: 100%; height: 100%; border: none; background: #111; }

  /* Stash sidebar */
  .sidebar { width: 150px; background: #16213e; border-left: 1px solid #0f3460; padding: 12px; font-size: 12px; flex-shrink: 0; }
  .sidebar h3 { font-size: 13px; color: #e94560; margin-bottom: 10px; letter-spacing: 1px; }
  .stash-row { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid #222; }
  .stash-label { color: #999; }
  .stash-val { color: #ccc; }

  /* Keyboard hint */
  .hint { font-size: 10px; color: #555; text-align: center; padding: 2px; background: #16213e; border-top: 1px solid #0f3460; }
</style>
</head>
<body>

<header>
  <h1>MISSION CONTROL</h1>
  <div class="header-controls">
    <button class="btn" id="cycleBtn" onclick="toggleCycle()">MANUAL</button>
    <span id="dayLabel">Day --</span>
  </div>
</header>

<div class="cards" id="cardRow"></div>

<div class="main">
  <div class="viewer">
    <iframe id="viewerFrame" src="about:blank"></iframe>
  </div>
  <div class="sidebar">
    <h3>STASH STATUS</h3>
    <div class="stash-row"><span class="stash-label">Bldg</span><span class="stash-val" id="stash-building">--</span></div>
    <div class="stash-row"><span class="stash-label">Metal</span><span class="stash-val" id="stash-metal">--</span></div>
    <div class="stash-row"><span class="stash-label">Food</span><span class="stash-val" id="stash-food">--</span></div>
    <div class="stash-row"><span class="stash-label">Tool</span><span class="stash-val" id="stash-tools">--</span></div>
    <div class="stash-row"><span class="stash-label">Other</span><span class="stash-val" id="stash-other">--</span></div>
    <div class="stash-row"><span class="stash-label">Free</span><span class="stash-val" id="stash-free">--</span></div>
    <div class="stash-row" style="border-bottom:none"><span class="stash-label" id="stash-top" style="font-size:11px;white-space:normal"></span></div>
  </div>
</div>

<div class="hint">Keys 1-5 select bots &middot; C toggles auto-cycle</div>

<script>
var COLORS = { Atlas:'#4fc3f7', Flora:'#81c784', Forge:'#ffb74d', Mason:'#ce93d8', Blade:'#ef5350' };
var bots = [];
var sockets = {};
var states = {};
var selectedIdx = 0;
var cycling = false;
var cycleTimer = null;

function esc(str) {
  var d = document.createElement('div');
  d.textContent = str;
  return d.textContent;
}

async function init() {
  try {
    async function pollStash() {
      try {
        var r = await fetch('/api/stash');
        var st = await r.json();
        if (!st.chestCount) return; // no chest opened yet this session
        ['building','metal','food','tools','other'].forEach(function(k) {
          document.getElementById('stash-' + k).textContent = st.categories[k] || 0;
        });
        document.getElementById('stash-free').textContent = st.freeSlots + '/' + st.totalSlots + ' slots';
        document.getElementById('stash-top').textContent =
          st.topItems.map(function(t) { return t.count + 'x' + t.name; }).join(', ');
      } catch (e) { /* dashboard may outlive bot process */ }
    }
    pollStash(); setInterval(pollStash, 5000);

    var res = await fetch('/api/roster');
    bots = await res.json();
  } catch (e) {
    document.getElementById('cardRow').textContent = 'Could not reach /api/roster';
    return;
  }
  buildCards();
  bots.forEach(function(b, i) { connectBot(b, i); });
  selectBot(0);
}

function buildCards() {
  var row = document.getElementById('cardRow');
  row.textContent = '';
  bots.forEach(function(b, i) {
    var c = document.createElement('div');
    c.className = 'card';
    c.id = 'card-' + i;
    var color = COLORS[b.name] || '#888';

    var nameEl = document.createElement('div');
    nameEl.className = 'card-name';
    nameEl.style.color = color;
    nameEl.textContent = b.name;
    c.appendChild(nameEl);

    var roleEl = document.createElement('div');
    roleEl.className = 'card-role';
    roleEl.textContent = b.role;
    c.appendChild(roleEl);

    var hpWrap = document.createElement('div');
    hpWrap.className = 'bar-wrap';
    var hpFill = document.createElement('div');
    hpFill.className = 'bar-fill';
    hpFill.id = 'hp-' + i;
    hpFill.style.width = '100%';
    hpFill.style.background = '#4caf50';
    hpWrap.appendChild(hpFill);
    c.appendChild(hpWrap);

    var foodWrap = document.createElement('div');
    foodWrap.className = 'bar-wrap';
    var foodFill = document.createElement('div');
    foodFill.className = 'bar-fill';
    foodFill.id = 'food-' + i;
    foodFill.style.width = '100%';
    foodFill.style.background = '#8d6e63';
    foodWrap.appendChild(foodFill);
    c.appendChild(foodWrap);

    var actEl = document.createElement('div');
    actEl.className = 'card-action';
    actEl.id = 'act-' + i;
    actEl.textContent = '--';
    c.appendChild(actEl);

    var thEl = document.createElement('div');
    thEl.className = 'card-thought';
    thEl.id = 'thought-' + i;
    c.appendChild(thEl);

    var posEl = document.createElement('div');
    posEl.className = 'card-pos';
    posEl.id = 'pos-' + i;
    posEl.textContent = '(--)';
    c.appendChild(posEl);

    var viewBtn = document.createElement('div');
    viewBtn.className = 'card-view';
    viewBtn.textContent = 'VIEW';
    viewBtn.addEventListener('click', (function(idx) {
      return function(e) { e.stopPropagation(); selectBot(idx); };
    })(i));
    c.appendChild(viewBtn);

    c.addEventListener('click', (function(idx) {
      return function() { selectBot(idx); };
    })(i));

    row.appendChild(c);
  });
}

function connectBot(bot, idx) {
  var url = 'http://' + location.hostname + ':' + bot.overlayPort;
  var sock;
  try { sock = io(url, { reconnection: true, reconnectionDelay: 3000, timeout: 5000 }); } catch(e) { return; }
  sockets[bot.name] = sock;

  sock.on('state', function(s) {
    states[bot.name] = s;
    renderCard(idx, s);
  });
  sock.on('connect_error', function() { renderOffline(idx); });
  sock.on('disconnect', function() { renderOffline(idx); });
}

function renderCard(idx, s) {
  var hpPct = Math.max(0, Math.min(100, (s.health / 20) * 100));
  var foodPct = Math.max(0, Math.min(100, (s.food / 20) * 100));
  var hpBar = document.getElementById('hp-' + idx);
  var foodBar = document.getElementById('food-' + idx);
  if (hpBar) {
    hpBar.style.width = hpPct + '%';
    hpBar.style.background = hpPct > 50 ? '#4caf50' : hpPct > 25 ? '#ff9800' : '#f44336';
  }
  if (foodBar) {
    foodBar.style.width = foodPct + '%';
  }
  var actEl = document.getElementById('act-' + idx);
  if (actEl) actEl.textContent = s.action || '--';
  var thEl = document.getElementById('thought-' + idx);
  if (thEl) {
    var t = s.thought || '';
    thEl.textContent = t.length > 60 ? t.slice(0, 57) + '...' : t;
  }
  var posEl = document.getElementById('pos-' + idx);
  if (posEl && s.position) {
    posEl.textContent = '(' + Math.round(s.position.x) + ', ' + Math.round(s.position.y) + ', ' + Math.round(s.position.z) + ')';
  }
}

function renderOffline(idx) {
  var actEl = document.getElementById('act-' + idx);
  if (actEl) actEl.textContent = 'offline';
  var thEl = document.getElementById('thought-' + idx);
  if (thEl) thEl.textContent = '';
}

var viewerLoaded = false;

function selectBot(idx) {
  if (idx < 0 || idx >= bots.length) return;
  selectedIdx = idx;
  document.querySelectorAll('.card').forEach(function(c, i) {
    var color = COLORS[bots[i].name] || '#888';
    if (i === idx) {
      c.classList.add('selected');
      c.style.borderColor = color;
    } else {
      c.classList.remove('selected');
      c.style.borderColor = '#333';
    }
  });

  var frame = document.getElementById('viewerFrame');
  var botName = bots[idx].name;

  // Unified viewer: all bots share a single viewer server on port 3000.
  // Load the iframe once, then use postMessage to switch bots without reloading
  // the page (no re-download of JS/textures).
  var viewerUrl = 'http://' + location.hostname + ':3000';

  if (!viewerLoaded) {
    // First time: load the viewer iframe with the selected bot as a hash hint
    frame.src = viewerUrl + '/#' + botName;
    viewerLoaded = true;

    // Also listen for the iframe to fully load, then send postMessage as backup
    frame.onload = function() {
      frame.contentWindow.postMessage({ type: 'switchBot', botName: botName }, '*');
    };
  } else {
    // Subsequent switches: just send a postMessage — no page reload
    try {
      frame.contentWindow.postMessage({ type: 'switchBot', botName: botName }, '*');
    } catch (e) {
      // Cross-origin fallback: reload the iframe (shouldn't happen on same host)
      frame.src = viewerUrl + '/#' + botName;
    }
  }
}

function toggleCycle() {
  cycling = !cycling;
  var btn = document.getElementById('cycleBtn');
  if (cycling) {
    btn.classList.add('active');
    btn.textContent = 'AUTO';
    cycleTimer = setInterval(function() {
      selectBot((selectedIdx + 1) % bots.length);
    }, 30000);
  } else {
    btn.classList.remove('active');
    btn.textContent = 'MANUAL';
    clearInterval(cycleTimer);
    cycleTimer = null;
  }
}

document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key >= '1' && e.key <= '5') {
    var idx = parseInt(e.key) - 1;
    if (idx < bots.length) selectBot(idx);
  }
  if (e.key === 'c' || e.key === 'C') toggleCycle();
});

init();
</script>

<!-- Ops panel: server-verified milestones, API spend, TPS, resources (data: /api/ops) -->
<style>
  #opsToggle { position: fixed; right: 12px; bottom: 12px; z-index: 50; }
  #ops { position: fixed; top: 0; right: 0; width: 380px; max-width: 100vw; height: 100vh; overflow-y: auto; background: #16213e; border-left: 1px solid #0f3460; padding: 12px 14px 60px; z-index: 40; font-size: 12px; display: none; }
  #ops.open { display: block; }
  #ops h2 { font-size: 13px; color: #e94560; letter-spacing: 1px; margin: 12px 0 6px; }
  #ops table { width: 100%; border-collapse: collapse; }
  #ops td, #ops th { padding: 2px 4px; text-align: left; border-bottom: 1px solid #23305a; font-variant-numeric: tabular-nums; }
  #ops th { color: #888; font-weight: 600; }
  .ms-done { color: #5fd38d; } .ms-todo { color: #777; } .warn { color: #f0a500; }
</style>
<button class="btn" id="opsToggle" onclick="document.getElementById('ops').classList.toggle('open')">Ops</button>
<div id="ops"><div id="opsBody">Loading…</div></div>
<script>
(function () {
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function usd(n) { return '$' + (n || 0).toFixed(4); }
  async function refresh() {
    var d;
    try { d = await (await fetch('/api/ops')).json(); } catch (e) { document.getElementById('opsBody').textContent = 'Ops endpoint unreachable'; return; }
    var a = d.api, h = [];
    h.push('<h2>MILESTONES (verified from server files)</h2><table>');
    d.milestones.forEach(function (m) {
      h.push('<tr title="' + esc(m.evidence) + '"><td class="' + (m.done ? 'ms-done' : 'ms-todo') + '">' + (m.done ? '✔' : '·') + ' ' + m.id + '. ' + esc(m.title) + '</td><td>' + (m.verifiedAt ? esc(m.verifiedAt.slice(0, 16).replace('T', ' ')) : '') + '</td></tr>');
    });
    h.push('</table><h2>API SPEND</h2>');
    if (a.pausedReason) h.push('<div class="warn">PAUSED: ' + esc(a.pausedReason) + '</div>');
    h.push('<table><tr><th></th><th>calls</th><th>cost</th><th>cap</th></tr>');
    h.push('<tr><td>today</td><td>' + a.today.calls + '</td><td>' + usd(a.today.costUsd) + '</td><td>$' + a.dailyCapUsd.toFixed(2) + '</td></tr>');
    h.push('<tr><td>lifetime</td><td>' + a.lifetime.calls + '</td><td>' + usd(a.lifetime.costUsd) + '</td><td>$' + a.totalCapUsd.toFixed(2) + '</td></tr></table>');
    h.push('<table><tr><th>bot / model</th><th>calls</th><th>in</th><th>cached</th><th>out</th><th>cost</th></tr>');
    [a.todayByBot, a.todayByModel].forEach(function (group) {
      Object.keys(group).forEach(function (k) {
        var b = group[k];
        h.push('<tr><td>' + esc(k) + '</td><td>' + b.calls + '</td><td>' + b.inputTokens + '</td><td>' + b.cacheReadTokens + '</td><td>' + b.outputTokens + '</td><td>' + usd(b.costUsd) + '</td></tr>');
      });
    });
    h.push('</table><h2>BOTS (server stats)</h2><table><tr><th>bot</th><th>deaths</th><th>alive min</th><th>play min</th><th>adv.</th></tr>');
    d.perBot.forEach(function (b) { h.push('<tr><td>' + esc(b.name) + '</td><td>' + b.deaths + '</td><td>' + b.minutesSinceDeath + '</td><td>' + b.playTimeMin + '</td><td>' + b.advancements + '</td></tr>'); });
    h.push('</table><h2>SERVER</h2><div>' + esc(d.server.tps) + '</div><div>' + esc(d.server.players) + '</div>');
    h.push('<h2>HOST</h2><div>load ' + d.host.load.join(' / ') + ' · RAM ' + d.host.memUsedMb + ' / ' + d.host.memTotalMb + ' MB</div><table>');
    d.host.processes.forEach(function (p) { h.push('<tr><td>' + esc(p.name) + '</td><td>' + p.rssMb + ' MB</td><td>' + p.cpu + '% cpu</td></tr>'); });
    h.push('</table><div id="learnBody"></div><div style="color:#666;margin-top:8px">updated ' + esc(d.at.slice(11, 19)) + ' UTC</div>');
    document.getElementById('opsBody').innerHTML = h.join('');
    renderLearning();
  }
  // Sparkline: values as an SVG polyline, with a dashed zero line when the range crosses 0.
  function spark(vals, color) {
    if (!vals || vals.length < 2) return '<div style="color:#666">not enough data yet</div>';
    var w = 340, ht = 60, min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if (max === min) { max += 1; min -= 1; }
    var pts = vals.map(function (v, i) { return (i * w / (vals.length - 1)).toFixed(1) + ',' + (ht - (v - min) / (max - min) * ht).toFixed(1); }).join(' ');
    var zero = (min < 0 && max > 0) ? '<line x1="0" x2="' + w + '" y1="' + (ht - (0 - min) / (max - min) * ht).toFixed(1) + '" y2="' + (ht - (0 - min) / (max - min) * ht).toFixed(1) + '" stroke="#444" stroke-dasharray="3 3"/>' : '';
    return '<svg width="' + w + '" height="' + (ht + 4) + '" style="display:block;margin:4px 0">' + zero + '<polyline fill="none" stroke="' + color + '" stroke-width="1.5" points="' + pts + '"/></svg>' +
      '<div style="color:#888">min ' + min.toFixed(2) + ' · max ' + max.toFixed(2) + ' · last ' + vals[vals.length - 1].toFixed(2) + '</div>';
  }
  async function renderLearning() {
    var el = document.getElementById('learnBody'); if (!el) return;
    var L; try { L = await (await fetch('/api/learning')).json(); } catch (e) { el.textContent = 'learning endpoint unreachable'; return; }
    var c = L.combat, p = L.pearl, h = [];
    h.push('<h2>LEARNING · COMBAT (Q-learning, squad ' + esc(L.squad) + ')</h2>');
    h.push('<div>' + c.updates + ' updates · ε ' + c.epsilon.toFixed(3) + ' · ' + c.statesVisited + ' states seen · kills ' + c.kills + ' · deaths ' + c.deaths + '</div>');
    h.push('<div style="color:#888;margin-top:4px">mean reward per 25 decisions (higher = fighting better)</div>' + spark(c.curve, '#5fd38d'));
    h.push('<table><tr><th>tactic</th><th>uses</th><th>hits/use</th><th>reward</th></tr>');
    c.tactics.forEach(function (t) { h.push('<tr title="' + esc(t.info) + '"><td>' + esc(t.name) + '</td><td>' + t.uses + '</td><td>' + t.hitsPerUse.toFixed(2) + '</td><td>' + t.meanReward.toFixed(2) + '</td></tr>'); });
    h.push('</table><div style="color:#888;margin-top:6px">learned policy (healthy, level ground)</div><table><tr><th>distance</th><th>tactic</th><th>Q</th></tr>');
    c.policy.forEach(function (r) { h.push('<tr><td>' + esc(r.dist) + '</td><td>' + esc(r.tactic || '—') + '</td><td>' + (r.q === null ? '' : r.q.toFixed(2)) + '</td></tr>'); });
    h.push('</table><h2>LEARNING · PEARL AIM (physics + RLS)</h2>');
    h.push('<div>' + p.throws + ' throws (' + (p.blocked || 0) + ' blocked mid-air) · ' + p.samples + ' training samples · mean miss first 10: ' + (p.meanErrFirst10 === null ? '—' : p.meanErrFirst10.toFixed(2) + ' b') + ' → last 10: ' + (p.meanErrLast10 === null ? '—' : p.meanErrLast10.toFixed(2) + ' b') + '</div>');
    h.push('<div style="color:#888;margin-top:4px">landing error per throw, blocks (lower = better aim)</div>' + spark(p.errors, '#e94560'));
    el.innerHTML = h.join('');
  }
  refresh(); setInterval(refresh, 15000);
})();
</script>
</body>
</html>
